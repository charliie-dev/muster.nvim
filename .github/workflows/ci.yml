            0)
              echo '::error::effective Git HTTP extraheader is present'
              exit 1
              ;;
            1) ;;
            *)
              echo '::error::effective Git credential audit failed'
              exit 1
              ;;
          esac

      - name: Run full test suite
        run: nix --option accept-flake-config false --option netrc-file /dev/null develop --command busted

      - name: Assert clean tree
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo '::error::test job changed the working tree'
            exit 1
          fi
